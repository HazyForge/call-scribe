apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: call-scribe-provider-credentials
  namespace: call-scribe
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azurekv-cluster-secret-store
  target:
    name: call-scribe-provider-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: DISCORD_TOKEN
      remoteRef:
        key: secret/call-scribe-discord-bot-token
    - secretKey: ELEVENLABS_API_KEY
      remoteRef:
        key: secret/call-scribe-elevenlabs-api-key
    - secretKey: CALL_SCRIBE_DISCORD_GUILD_ID
      remoteRef:
        key: secret/call-scribe-discord-guild-id
    - secretKey: CALL_SCRIBE_DISCORD_CHANNEL_ID
      remoteRef:
        key: secret/call-scribe-discord-channel-id
