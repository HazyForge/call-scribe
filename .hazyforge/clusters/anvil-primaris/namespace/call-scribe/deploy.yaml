helmChartPath: charts/call-scribe

# Keep the worker stopped until persistent data has been migrated and the local
# daemon has been stopped. Exactly one Discord worker may use this identity.
replicaCount: 0

image:
  repository: ghcr.io/hazyforge/call-scribe
  tag: main
  digest: ""
  requireDigest: true
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-creds

persistence:
  storageClassName: observability-local
  size: 100Gi

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 1Gi

nodeSelector:
  kubernetes.io/hostname: z400
