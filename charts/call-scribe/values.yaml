# Start stopped so operators can provision secrets and persistent state before
# deliberately enabling the single Discord worker.
replicaCount: 0

image:
  repository: ghcr.io/hazyforge/call-scribe
  tag: main
  digest: ""
  requireDigest: false
  pullPolicy: IfNotPresent

imagePullSecrets: []
automountServiceAccountToken: false

providerCredentials:
  existingSecret: call-scribe-provider-credentials

database:
  existingSecret: call-scribe-database
  urlKey: uri

config:
  captureDir: /meetings/captures
  outputDir: "."
  sttProvider: eleven-labs
  sttTimeoutSeconds: 900
  sttDiarize: true
  sttTimestampsGranularity: word
  skipAnalysis: true
  # record-only leaves raw audio as a recording entry until Transcribe is invoked.
  captureMode: record-only
  organizationId: org_private_alpha

api:
  enabled: false
  replicaCount: 1
  port: 8080
  meetingsDir: /meetings
  webDir: /usr/share/call-scribe/web
  # Private-alpha convenience auth subject. Leave empty for real OIDC only.
  devAuthSub: ""
  oidcIssuer: ""
  oidcAudience: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  httpRoute:
    enabled: false
    gatewayName: gateway
    gatewayNamespace: gateway
    sectionName: https-callscribe-hazyforge-io
    hostnames:
      - callscribe.hazyforge.io

persistence:
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  size: 50Gi

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 1Gi

# The worker processes one captured session inline. This must remain longer than
# sttTimeoutSeconds so SIGTERM can be observed after a bounded provider call.
terminationGracePeriodSeconds: 960
nodeSelector: {}
tolerations: []
affinity: {}

networkPolicy:
  enabled: true
