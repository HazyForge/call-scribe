{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "call-scribe.fullname" . }}-deny-ingress
  labels:
    {{- include "call-scribe.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "call-scribe.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress: []
{{- end }}
