{{- if and .Values.image.requireDigest (gt (int .Values.replicaCount) 0) (not .Values.image.digest) }}
{{- fail "image.digest must be pinned before replicaCount is greater than zero" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "call-scribe.fullname" . }}
  labels:
    {{- include "call-scribe.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "call-scribe.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "call-scribe.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: call-scribe
          image: {{ include "call-scribe.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - discord
            - --repo
            - /meetings
            {{- if .Values.config.skipAnalysis }}
            - --skip-analysis
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ .Values.providerCredentials.existingSecret | quote }}
          env:
            - name: CALL_SCRIBE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret | quote }}
                  key: {{ .Values.database.urlKey | quote }}
            - name: CALL_SCRIBE_CAPTURE_DIR
              value: {{ .Values.config.captureDir | quote }}
            - name: CALL_SCRIBE_OUTPUT_DIR
              value: {{ .Values.config.outputDir | quote }}
            - name: CALL_SCRIBE_STT_PROVIDER
              value: {{ .Values.config.sttProvider | quote }}
            - name: CALL_SCRIBE_CAPTURE_MODE
              value: {{ .Values.config.captureMode | quote }}
            - name: CALL_SCRIBE_ORGANIZATION_ID
              value: {{ .Values.config.organizationId | quote }}
            {{- if .Values.hosted.enabled }}
            - name: CALL_SCRIBE_HOSTED_CONTROL_PLANE_URL
              value: {{ required "hosted.controlPlaneUrl is required when hosted.enabled=true" .Values.hosted.controlPlaneUrl | quote }}
            - name: CALL_SCRIBE_HOSTED_WORKER_ID
              value: {{ .Values.hosted.workerId | quote }}
            - name: CALL_SCRIBE_HOSTED_POLL_SECONDS
              value: {{ .Values.hosted.pollSeconds | quote }}
            - name: CALL_SCRIBE_HOSTED_MAX_STALENESS_SECONDS
              value: {{ .Values.hosted.maxStalenessSeconds | quote }}
            - name: CALL_SCRIBE_HOSTED_WORKLOAD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "hosted.workloadCredentials.existingSecret is required when hosted.enabled=true" .Values.hosted.workloadCredentials.existingSecret | quote }}
                  key: {{ .Values.hosted.workloadCredentials.tokenKey | quote }}
            - name: CALL_SCRIBE_HOSTED_OUTBOX_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.hosted.workloadCredentials.existingSecret | quote }}
                  key: {{ .Values.hosted.workloadCredentials.outboxEncryptionKey | quote }}
            {{- end }}
            - name: ELEVENLABS_STT_TIMEOUT_SECONDS
              value: {{ .Values.config.sttTimeoutSeconds | quote }}
            - name: ELEVENLABS_STT_DIARIZE
              value: {{ .Values.config.sttDiarize | quote }}
            - name: ELEVENLABS_STT_TIMESTAMPS_GRANULARITY
              value: {{ .Values.config.sttTimestampsGranularity | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: meetings
              mountPath: /meetings
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: meetings
          persistentVolumeClaim:
            claimName: {{ include "call-scribe.fullname" . }}
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
