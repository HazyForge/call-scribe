{{- if and .Values.api.enabled .Values.api.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "call-scribe.fullname" . }}-ui
  labels:
    {{- include "call-scribe.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  parentRefs:
    - name: {{ .Values.api.httpRoute.gatewayName }}
      namespace: {{ .Values.api.httpRoute.gatewayNamespace }}
      sectionName: {{ .Values.api.httpRoute.sectionName }}
  hostnames:
    {{- range .Values.api.httpRoute.hostnames }}
    - {{ . | quote }}
    {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "call-scribe.fullname" . }}-api
          port: {{ .Values.api.port }}
{{- end }}
